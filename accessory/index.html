<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Accessories</title>
    <link rel="stylesheet" href="/css/global.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="/js/TableAggregator.js"></script>
    <script>
        // Add event listener to the document to capture Enter key press
        document.addEventListener('keydown', function(event) {
            // Check if the Enter key is pressed
            if (event.keyCode === 13) {
                addItemJQuery();
            }
        });
    </script>

    <script>
        // Use JQuery to add an item to the table
        function addItemJQuery() {
            var accessory = $('#accessory-select').val();
            var amount = $('#amount-input').val();
            var accessoryName = $('#accessory-select option:selected').text();
            var price = accessory * amount;


            // Get the table
            var table = $('#product-list');
            // Add a new row to the table
            table.append('<tr><td>' + accessoryName + '</td><td>' + amount + '</td><td>$' + price.toFixed(2) + '</td></tr>');
            
            
            
            // Calculate the total price
            var totalPrice = 0;
            $('#product-list tr').each(function() {
                var priceText = $(this).find('td').eq(2).text().replace('$', '');
                var price = parseFloat(priceText);
                if (!isNaN(price)) {
                    totalPrice += price;
                }
            });

            // Calculate the VAT, and total amount
            var vatAmount = totalPrice * 0.07;
            var NetTotal = totalPrice + vatAmount;




            // Update the total price, VAT, and total amount
            $('#total-price').text('$' + totalPrice.toFixed(2));
            $('#VatAmount').text('$' + vatAmount.toFixed(2));
            $('#NetTotal').text('$' + NetTotal.toFixed(2));
        }
        
    </script>
    
</head>
<body>

    <h1>Car Accessories</h1>

    <h2>Add Accessory (Press Enter to Add Item to Table)</h2>
    <select id="accessory-select">
        <option value="10">Car Cover</option>
        <option value="20">Seat Covers</option>
        <option value="30">Phone Holder</option>
    </select>

    <!-- On Enter Add Item -->
    <input type="number" id="amount-input" min="1" value="1" onkeydown="if(event.keyCode === 13) addItemJQuery()">
    <button class="add-button" onclick="addItemJQuery()">Add</button>

    <br><br><br><br>

    <h2>Product List</h2>

    <table id="product-list">
        <tr>
            <th>Accessory</th>
            <th>Amount</th>
            <th>Price</th>
        </tr>
    </table>

    <br><br><br><br>
    <h2>Total Price (VAT Excluded): <span id="total-price">$0.00</span></h2>
    <h2>VAT (7% of Total Price): <span id="VatAmount">$0.00</span></h2>
    <h2>Net Total (VAT Included): <span id="NetTotal">$0.00</span></h2>
    
</body>
</html>
