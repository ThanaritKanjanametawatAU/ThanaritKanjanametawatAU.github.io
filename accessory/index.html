<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/TableAggregator.js"></script>
    <script src="accessory.js"></script>
    <link rel="stylesheet" href="accessory.css">


    <!-- Bootstrap-->
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
        integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
                        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
                        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"
                        integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd"
                        crossorigin="anonymous"></script>





</head>
<body>

    <h1>Car Accessories</h1>

    <h2>Add Accessory Here!!</h2>

    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#AddItemModal">Add Item</button>

    <br><br><br><br>

    <h2>Product List</h2>

    <table id="product-list", class="table table-bordered">
        <tr>
            <th>Accessory</th>
            <th>Amount</th>
            <th>Price</th>
        </tr>
    </table>

    <br><br><br><br>
    <h2>Total Price (VAT Excluded): <span id="total-price">$0.00</span></h2>
    <h2>VAT (7% of Total Price): <span id="VatAmount">$0.00</span></h2>
    <h2>Net Total (VAT Included): <span id="NetTotal">$0.00</span></h2>



</body>



<footer>


    <!-- Modal -->

    <div class="modal fade" id="AddItemModal" tabindex="-1" role="dialog"
        aria-labelledby="AddItemModalLabel" aria-hidden="true">

        <div class="modal-dialog" role="document">

            <div class="modal-content">

                <!-- modal-header -->
                <div class="modal-header">
                    <h2 class="modal-title" id="AddItemModalLabel">Add Item</h2>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>


                <!-- modal-body -->
                <div class="modal-body">
                    <table class="table">
                        <tr>
                            <td>Description</td>
                            <td><input type="text" id="newItemDescription"></td>
                        </tr>
                        <tr>
                            <td>Price Per Unit</td>
                            <td><input type="number" min="0" id="newItemPPU"></td>
                        </tr>
                        <tr>
                            <td>Quantity</td>
                            <td><input type="number" min="0" id="newItemQty"></td>
                        </tr>
                    </table>
                </div>


                
                <!-- modal-footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="addItem()">Save New
                        Item</button>
                </div>


            </div>

        </div>

    </div>



    
</footer>
</html>
