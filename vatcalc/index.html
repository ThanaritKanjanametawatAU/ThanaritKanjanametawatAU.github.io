<!DOCTYPE html>
<html>

<head>
    <title>VAT Calculator</title>
    <script src="/js/VATCalculator.js"></script>
    <script>
        // Add event listener to the document to capture Enter key press
        document.addEventListener('keydown', function(event) {
            // Check if the Enter key is pressed
            if (event.keyCode === 13) {
                calculateVAT();
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
</head>


<body>
    <h1>VAT Calculator</h1>
    <label for="grossPrice">Enter Gross Price (Press Enter to Calculate and Display Results):</label>
    <!--When click Enter, call calculateVAT Function -->
    <input type="text" id="grossPrice" onkeydown="if(event.keyCode === 13) calculateVAT()">
    <button onclick="calculateVAT()">Calculate</button>

    <br>
    
    <label for="vatAmount">VAT Amount:</label>
    <span id="vatAmount"></span>

    <br>

    <label for="TotalAmount">Total Amount:</label>
    <span id="TotalAmount"></span>


</body>


</html>
